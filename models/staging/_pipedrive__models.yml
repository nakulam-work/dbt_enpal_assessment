version: 2

models:
  - name: stg_pipedrive__deal_changes
    columns:
      - name: deal_id
        data_tests: [not_null]
      - name: field_key
        data_tests: [not_null]

  - name: stg_pipedrive__activities
    description: activity_id is not unique in source; activity_sk is the grain.
    columns:
      - name: activity_sk
        data_tests: [not_null, unique]
      - name: activity_type_key
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_pipedrive__activity_types')
              field: activity_type_key

  - name: stg_pipedrive__activity_types
    columns:
      - name: activity_type_id
        data_tests: [not_null, unique]
      - name: activity_type_key
        data_tests: [not_null, unique]

  - name: stg_pipedrive__stages
    columns:
      - name: stage_id
        data_tests: [not_null, unique]

  - name: stg_pipedrive__users
    columns:
      - name: user_id
        data_tests: [not_null, unique]

  - name: stg_pipedrive__fields
    columns:
      - name: field_id
        data_tests: [not_null, unique]

  - name: stg_pipedrive__lost_reasons
    columns:
      - name: lost_reason_id
        data_tests: [not_null, unique]